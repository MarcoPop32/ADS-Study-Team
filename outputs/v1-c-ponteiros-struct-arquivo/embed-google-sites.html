<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guia Interativo ADS</title>
  <style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-alt: #f1f5f9;
  --text: #0f172a;
  --muted: #475569;
  --border: #cbd5e1;
  --primary: #1d4ed8;
  --primary-soft: #dbeafe;
  --ok: #15803d;
  --ok-soft: #dcfce7;
  --err: #b91c1c;
  --err-soft: #fee2e2;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --code-bg: #0f172a;
  --code-text: #e2e8f0;
  --radius: 12px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
}

.app-shell {
  max-width: 820px;
  margin: 0 auto;
  padding: 16px;
}

.hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
}

.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--primary-soft);
  color: var(--primary);
}

.badge-muted {
  background: var(--surface-alt);
  color: var(--muted);
}

.hero h1 {
  margin: 4px 0 8px;
  font-size: 1.5rem;
  line-height: 1.25;
}

.subtitle {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 0.96rem;
}

.meta-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 0.85rem;
  color: var(--muted);
}

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

.tab-btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.92rem;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.tab-btn.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

.tab-panel {
  display: none;
}

.tab-panel.active {
  display: block;
}

.panel-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.panel-header h2 {
  margin: 0;
  font-size: 1.2rem;
}

.muted {
  color: var(--muted);
  margin: 2px 0 0;
  font-size: 0.9rem;
}

.pill-score {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}

.card h3 {
  margin: 0 0 8px;
  font-size: 1.08rem;
  color: var(--primary);
}

.callout {
  border-radius: 8px;
  padding: 10px 12px;
  margin: 10px 0;
  font-size: 0.92rem;
}

.callout-analogia {
  background: var(--primary-soft);
}

.callout-armadilha {
  background: var(--warn-soft);
  color: #78350f;
}

pre {
  background: var(--code-bg);
  color: var(--code-text);
  padding: 12px;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 0.86rem;
  line-height: 1.45;
  margin: 10px 0;
}

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.ce-actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.btn-choice {
  flex: 1;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-alt);
  font-weight: 600;
  cursor: pointer;
}

.btn-choice.selected-ok {
  background: var(--ok-soft);
  border-color: var(--ok);
  color: var(--ok);
}

.btn-choice.selected-err {
  background: var(--err-soft);
  border-color: var(--err);
  color: var(--err);
}

.feedback-box {
  margin-top: 12px;
  border-radius: 8px;
  padding: 12px;
  border-left: 4px solid var(--border);
  background: var(--surface-alt);
  font-size: 0.92rem;
}

.feedback-box.ok {
  background: var(--ok-soft);
  border-left-color: var(--ok);
}

.feedback-box.err {
  background: var(--err-soft);
  border-left-color: var(--err);
}

.feedback-box ol {
  margin: 8px 0;
  padding-left: 20px;
}

.opt-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-top: 8px;
  cursor: pointer;
  background: var(--surface);
}

.opt-label.opt-correct {
  background: var(--ok-soft);
  border-color: var(--ok);
}

.opt-label.opt-wrong {
  background: var(--err-soft);
  border-color: var(--err);
}

.sim-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.btn-primary,
.btn-secondary {
  padding: 11px 18px;
  border-radius: 9px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
}

.btn-primary {
  background: var(--primary);
  color: #ffffff;
}

.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border);
}

.result-banner {
  margin-top: 14px;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 2px solid var(--primary);
  font-weight: 600;
}

.refs-footer {
  margin-top: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  font-size: 0.9rem;
}

.refs-footer h3 {
  margin: 0 0 8px;
  font-size: 1rem;
}

.refs-footer ul {
  margin: 0;
  padding-left: 18px;
}

@media (max-width: 600px) {
  .tabs {
    grid-template-columns: 1fr;
  }
  .app-shell {
    padding: 10px;
  }
}

</style>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-top">
        <span id="meta-disciplina" class="badge">ATP — ADS</span>
        <span id="meta-versao" class="badge badge-muted">v1</span>
      </div>
      <h1 id="meta-titulo">Carregando material...</h1>
      <p id="meta-resumo" class="subtitle"></p>
      <div class="meta-bar">
        <span id="meta-tempo"></span>
        <span id="meta-contagem"></span>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Navegação do material">
      <button class="tab-btn active" data-tab="resumo" role="tab" aria-selected="true">Resumo Direto</button>
      <button class="tab-btn" data-tab="ce" role="tab" aria-selected="false">Certo ou Errado</button>
      <button class="tab-btn" data-tab="simulado" role="tab" aria-selected="false">Simulado</button>
    </nav>

    <main>
      <section id="tab-resumo" class="tab-panel active"></section>

      <section id="tab-ce" class="tab-panel">
        <div class="panel-header">
          <div>
            <h2>Questões Certo ou Errado</h2>
            <p class="muted">Responda para ver a explicação passo a passo na hora.</p>
          </div>
          <div id="ce-placar" class="pill-score">0 / 0 respondidas</div>
        </div>
        <div id="ce-lista" class="stack"></div>
      </section>

      <section id="tab-simulado" class="tab-panel">
        <div class="panel-header">
          <div>
            <h2>Simulado Prático</h2>
            <p class="muted">Marque uma alternativa por questão e clique em Finalizar.</p>
          </div>
          <div id="sim-progresso" class="pill-score">0 / 0 marcadas</div>
        </div>
        <div id="sim-lista" class="stack"></div>
        <div class="sim-actions">
          <button id="btn-finalizar-simulado" class="btn-primary" type="button">Finalizar Simulado</button>
          <button id="btn-refazer-simulado" class="btn-secondary" type="button" hidden>Refazer Simulado</button>
        </div>
        <div id="sim-resultado" class="result-banner" hidden></div>
      </section>
    </main>

    <footer class="refs-footer">
      <h3>Referências Técnicas Verificadas</h3>
      <ul id="lista-referencias"></ul>
    </footer>
  </div>

  <script>
window.__STUDY_DATA__ = {
  "meta": {
    "titulo": "Ponteiros, Struct e Arquivo em C",
    "disciplina": "ATP — Análise e Desenvolvimento de Sistemas",
    "resumo_curto": "Guia direto ao ponto sobre endereços de memória, registros (struct), operador seta (->) e leitura/gravação de arquivos (FILE *) com questões comentadas.",
    "tempo_leitura_min": 5,
    "versao": "v1"
  },
  "secoes_estudo": [
    {
      "id": "ponteiros",
      "titulo": "1. Ponteiros (&, * e passagem por referência)",
      "explicacao_curta": "Um ponteiro é uma variável que armazena o endereço de memória de outra variável. Use & para pegar o endereço e * para ler ou alterar o valor guardado naquele endereço.",
      "analogia": "A variável é a casa; o ponteiro é um papel com o endereço da casa escrito. Alterar o imóvel usando o endereço muda a casa original.",
      "codigo_c": "#include <stdio.h>\n\nvoid dobrar(int *p) {\n    if (p != NULL) {\n        *p = (*p) * 2; // Altera o valor original na memoria\n    }\n}\n\nint main(void) {\n    int x = 10;\n    int *ptr = &x; // ptr guarda o endereco de x\n    dobrar(ptr);\n    printf(\"x = %d\\n\", x); // Imprime 20\n    return 0;\n}",
      "explicacao_codigo": "int *ptr = &x guarda o endereço de x. Ao passar ptr para dobrar(), a função acessa diretamente a memória de x via *p e dobra seu valor sem retornar nada.",
      "armadilha_comum": "Desreferenciar um ponteiro não inicializado ou NULL (*ptr = 5) causa falha de segmentação (crash imediato)."
    },
    {
      "id": "structs",
      "titulo": "2. Structs e o operador seta (->)",
      "explicacao_curta": "Struct agrupa campos de tipos diferentes sob um mesmo nome. Se você tem a variável struct, acesse campos com ponto (.). Se você tem um ponteiro para struct, acesse com seta (->).",
      "analogia": "Ponto (.) abre a gaveta diretamente com a mão; seta (->) segue o ponteiro até o armário e já abre a gaveta.",
      "codigo_c": "#include <stdio.h>\n\ntypedef struct {\n    int id;\n    float nota;\n} Aluno;\n\nvoid darPontoExtra(Aluno *a, float bonus) {\n    if (a != NULL) {\n        a->nota += bonus; // Equivale a (*a).nota += bonus\n    }\n}\n\nint main(void) {\n    Aluno alu = {1, 7.0f};\n    darPontoExtra(&alu, 1.5f);\n    printf(\"Nota final: %.1f\\n\", alu.nota); // 8.5\n    return 0;\n}",

      "armadilha_comum": "Escrever *a.nota em vez de (*a).nota ou a->nota: em C, o operador ponto (.) tem precedência maior que o asterisco (*), gerando erro de compilação."

    {

      "explicacao_curta": "Em C, todo arquivo aberto é controlado por um ponteiro FILE *. Você abre com fopen(caminho, modo), verifica se é diferente de NULL, lê/grava e sempre fecha com fclose(fp).",
      "analogia": "fopen() pega a chave da sala e abre a porta; if (fp == NULL) confirma se a porta abriu mesmo; fclose() tranca e salva o que ficou no buffer.",
      "codigo_c": "#include <stdio.h>\n#include <stdlib.h>\n\nint main(void) {\n    FILE *fp = fopen(\"notas.txt\", \"w\"); // \"w\" cria ou sobrescreve\n    if (fp == NULL) {\n        perror(\"Falha ao abrir arquivo\");\n        return EXIT_FAILURE;\n    }\n    fprintf(fp, \"Aluno: Ana | Nota: %.1f\\n\", 9.0);\n    fclose(fp);\n    return 0;\n}",
      "explicacao_codigo": "O modo \"w\" cria o arquivo ou apaga o conteúdo anterior. Para acrescentar no fim use \"a\"; para ler use \"r\". Sempre cheque fp == NULL antes de usar fprintf ou fscanf.",

    },
    {
      "id": "integracao-binaria",
      "titulo": "4. Gravando e lendo Structs em Arquivo (fwrite / fread)",
      "explicacao_curta": "Para salvar structs em disco rapidamente, usamos arquivos binários (\"wb\" e \"rb\") com fwrite() e fread(), sempre checando quantos itens foram realmente gravados ou lidos.",

      "codigo_c": "#include <stdio.h>\n\ntypedef struct {\n    int codigo;\n    char nome[40]; // Array fixo (nunca char * ao usar fwrite direto)\n    float preco;\n} Produto;\n\nint main(void) {\n    Produto p = {10, \"Teclado\", 149.90f};\n    FILE *fp = fopen(\"estoque.bin\", \"wb\");\n    if (fp != NULL) {\n        fwrite(&p, sizeof(Produto), 1, fp);\n        fclose(fp);\n    }\n\n    Produto lido;\n    fp = fopen(\"estoque.bin\", \"rb\");\n    if (fp != NULL && fread(&lido, sizeof(Produto), 1, fp) == 1) {\n        printf(\"%d - %s (R$ %.2f)\\n\", lido.codigo, lido.nome, lido.preco);\n    }\n    if (fp != NULL) fclose(fp);\n    return 0;\n}",

      "gabarito": true,
      "explicacao_passos": [

      "explicacao_correta": "Primeiro p aponta para a, então *p = 8 altera a para 8. Depois p passa a apontar para b (12) e *p = *p + a faz b = 12 + 8 = 20. Resultado: 8 20.",
      "por_que_outras_falham": "A ignora que *p = 8 mudou a; B soma a antigo (5) com 12; D confunde os valores finais de a e b."
    },
    {
      "id": "s4",
      "enunciado": "Qual verificação garante que 3 registros da struct Item foram realmente lidos de 'itens.bin'?",
      "codigo_opcional": "Item vet[3];\nFILE *fp = fopen(\"itens.bin\", \"rb\");",
      "alternativas": [
        "if (fp != NULL && fread(vet, sizeof(Item), 3, fp) == 3)",
        "if (fp != NULL && fread(vet, sizeof(Item), 3, fp) == 3 * sizeof(Item))",
        "if (fread(vet, 1, 3, fp) == 3)",
        "if (fopen == NULL)"
      ],
      "correta": 0,
      "explicacao_correta": "Primeiro valida se fp != NULL e depois checa se fread retornou exatamente 3 (o número de elementos Item lidos).",
      "por_que_outras_falham": "B confunde contagem de itens com total de bytes; C lê apenas 3 bytes (size=1) e não verifica fp != NULL; D compara função em vez de ponteiro."

    {

      "enunciado": "Por que Beej's Guide alerta que gravar uma struct inteira com fwrite() nem sempre é portável entre máquinas/compiladores?",
      "codigo_opcional": "",
      "alternativas": [
        "Porque fwrite só aceita strings char*.",
        "Porque o compilador pode inserir bytes de padding e arquiteturas mudam a endianness.",
        "Porque fclose() apaga os dados se usar struct.",
        "Porque FILE* não funciona com sizeof()."
      ],
      "correta": 1,
      "explicacao_correta": "Compiladores inserem padding de alinhamento entre campos da struct, e CPUs diferentes podem usar little-endian ou big-endian.",
      "por_que_outras_falham": "A é falso (fwrite grava qualquer bloco de bytes); C e D são tecnicamente falsos em C."
    },
    {
      "id": "s6",
      "enunciado": "Ao ler strings de um arquivo com entrada de tamanho desconhecido, qual cuidado evita buffer overflow?",
      "codigo_opcional": "char linha[64];",
      "alternativas": [
        "Usar fscanf(fp, \"%s\", linha) sem limite de largura.",
        "Usar fgets(linha, sizeof(linha), fp) informando o tamanho máximo do buffer.",
        "Usar fwrite(linha, sizeof(linha), 1, fp) para ler.",
        "Remover o '\\0' do final da string antes de abrir o arquivo."
      ],
      "correta": 1,
      "explicacao_correta": "fgets(linha, sizeof(linha), fp) limita a leitura ao tamanho do buffer e garante o terminador '\\0' ao final.",

  "referencias": [
    {
      "titulo": "Beej's Guide to C Programming — Cap. 9: File Input/Output",
      "url": "https://beej.us/guide/bgc/html/split/file-inputoutput.html",
      "tipo": "Guia Técnico"
    },
    {
      "titulo": "Beej's Guide to C Programming — Cap. 8: Structs",
      "url": "https://beej.us/guide/bgc/html/split/structs.html",
      "tipo": "Guia Técnico"
    },
    {
      "titulo": "cppreference — fopen, fopen_s (<stdio.h>)",
      "url": "https://en.cppreference.com/c/io/fopen",
      "tipo": "Documentação Oficial C"
    },
    {
      "titulo": "cppreference — fread / fwrite (<stdio.h>)",
      "url": "https://en.cppreference.com/w/c/io/fread",
      "tipo": "Documentação Oficial C"
    }
  ]
}
;
</script>
<script>
(function () {
  "use strict";

  let studyData = null;
  const ceAnswers = {};
  const simAnswers = {};
  let simFinished = false;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  async function loadData() {
    if (window.__STUDY_DATA__) {
      return window.__STUDY_DATA__;
    }
    const resp = await fetch("./content.json");
    if (!resp.ok) {
      throw new Error("Nao foi possivel carregar content.json");
    }
    return resp.json();
  }

  function setupTabs() {
    const buttons = document.querySelectorAll(".tab-btn");
    const panels = document.querySelectorAll(".tab-panel");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const target = btn.getAttribute("data-tab");
        buttons.forEach((b) => {
          const active = b === btn;
          b.classList.toggle("active", active);
          b.setAttribute("aria-selected", active ? "true" : "false");
        });
        panels.forEach((p) => {
          p.classList.toggle("active", p.id === "tab-" + target);
        });
      });
    });
  }

  function renderHeader(data) {
    document.title = data.meta.titulo + " | Guia ADS";
    document.getElementById("meta-disciplina").textContent = data.meta.disciplina;
    document.getElementById("meta-versao").textContent = data.meta.versao;
    document.getElementById("meta-titulo").textContent = data.meta.titulo;
    document.getElementById("meta-resumo").textContent = data.meta.resumo_curto;
    document.getElementById("meta-tempo").textContent =
      "Leitura estimada: " + data.meta.tempo_leitura_min + " min";
    document.getElementById("meta-contagem").textContent =
      data.secoes_estudo.length +
      " blocos • " +
      data.certo_errado.length +
      " Certo/Errado • " +
      data.simulado.length +
      " questões no Simulado";
  }

  function renderResumo(data) {
    const root = document.getElementById("tab-resumo");
    root.innerHTML = "";
    const stack = el("div", "stack");

    data.secoes_estudo.forEach((sec) => {
      const card = el("article", "card");
      card.appendChild(el("h3", null, sec.titulo));
      card.appendChild(el("p", null, sec.explicacao_curta));

      const analogia = el("div", "callout callout-analogia");
      const strongA = el("strong", null, "Analogia rápida: ");
      analogia.appendChild(strongA);
      analogia.appendChild(document.createTextNode(sec.analogia));
      card.appendChild(analogia);

      const pre = el("pre");
      const code = el("code", null, sec.codigo_c);
      pre.appendChild(code);
      card.appendChild(pre);

      card.appendChild(el("p", null, sec.explicacao_codigo));

      const trap = el("div", "callout callout-armadilha");
      const strongT = el("strong", null, "Armadilha comum: ");
      trap.appendChild(strongT);
      trap.appendChild(document.createTextNode(sec.armadilha_comum));
      card.appendChild(trap);

      stack.appendChild(card);
    });

    root.appendChild(stack);
  }

  function updateCeScore() {
    const total = studyData.certo_errado.length;
    const answered = Object.keys(ceAnswers).length;
    const hits = studyData.certo_errado.filter(
      (q) => ceAnswers[q.id] === q.gabarito
    ).length;
    document.getElementById("ce-placar").textContent =
      answered + " / " + total + " respondidas (" + hits + " acertos)";
  }

  function renderCertoErrado(data) {
    const root = document.getElementById("ce-lista");
    root.innerHTML = "";

    data.certo_errado.forEach((q, idx) => {
      const card = el("article", "card");
      card.appendChild(el("h3", null, "Questão " + (idx + 1)));
      card.appendChild(el("p", null, q.enunciado));

      const actions = el("div", "ce-actions");
      const btnCerto = el("button", "btn-choice", "Certo");
      btnCerto.type = "button";
      const btnErrado = el("button", "btn-choice", "Errado");
      btnErrado.type = "button";

      const feedback = el("div", "feedback-box");
      feedback.hidden = true;

      function handleChoice(choice) {
        ceAnswers[q.id] = choice;
        const ok = choice === q.gabarito;
        btnCerto.className = "btn-choice" + (choice === true ? (ok ? " selected-ok" : " selected-err") : "");
        btnErrado.className = "btn-choice" + (choice === false ? (ok ? " selected-ok" : " selected-err") : "");

        feedback.className = "feedback-box " + (ok ? "ok" : "err");
        feedback.innerHTML = "";
        const statusText = ok
          ? "Você acertou! Gabarito: " + (q.gabarito ? "CERTO" : "ERRADO")
          : "Resposta incorreta. Gabarito: " + (q.gabarito ? "CERTO" : "ERRADO");
        feedback.appendChild(el("strong", null, statusText));

        const ol = el("ol");
        q.explicacao_passos.forEach((step) => {
          ol.appendChild(el("li", null, step));
        });
        feedback.appendChild(ol);

        const pk = el("p");
        pk.appendChild(el("strong", null, "Ponto-chave: "));
        pk.appendChild(document.createTextNode(q.ponto_chave));
        feedback.appendChild(pk);

        feedback.hidden = false;
        updateCeScore();
      }

      btnCerto.addEventListener("click", () => handleChoice(true));
      btnErrado.addEventListener("click", () => handleChoice(false));

      actions.appendChild(btnCerto);
      actions.appendChild(btnErrado);
      card.appendChild(actions);
      card.appendChild(feedback);
      root.appendChild(card);
    });

    updateCeScore();
  }

  function updateSimProgress() {
    const total = studyData.simulado.length;
    const marked = Object.keys(simAnswers).length;
    document.getElementById("sim-progresso").textContent =
      marked + " / " + total + " marcadas";
  }

  function renderSimulado(data) {
    const root = document.getElementById("sim-lista");
    root.innerHTML = "";

    data.simulado.forEach((q, idx) => {
      const card = el("article", "card");
      card.setAttribute("data-qid", q.id);
      card.appendChild(el("h3", null, "Questão " + (idx + 1)));
      card.appendChild(el("p", null, q.enunciado));

      if (q.codigo_opcional && q.codigo_opcional.trim()) {
        const pre = el("pre");
        pre.appendChild(el("code", null, q.codigo_opcional));
        card.appendChild(pre);
      }

      const optsWrap = el("div", "sim-options");
      q.alternativas.forEach((alt, optIdx) => {
        const label = el("label", "opt-label");
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "sim-" + q.id;
        radio.value = String(optIdx);
        radio.checked = simAnswers[q.id] === optIdx;
        radio.disabled = simFinished;
        radio.addEventListener("change", () => {
          simAnswers[q.id] = optIdx;
          updateSimProgress();
        });

        label.appendChild(radio);
        label.appendChild(el("span", null, String.fromCharCode(65 + optIdx) + ") " + alt));

        if (simFinished) {
          if (optIdx === q.correta) {
            label.classList.add("opt-correct");
          } else if (simAnswers[q.id] === optIdx) {
            label.classList.add("opt-wrong");
          }
        }
        optsWrap.appendChild(label);
      });
      card.appendChild(optsWrap);

      if (simFinished) {
        const ok = simAnswers[q.id] === q.correta;
        const fb = el("div", "feedback-box " + (ok ? "ok" : "err"));
        fb.appendChild(
          el(
            "strong",
            null,
            ok
              ? "Acertou! Alternativa correta: " + String.fromCharCode(65 + q.correta)
              : "Errou. Alternativa correta: " + String.fromCharCode(65 + q.correta)
          )
        );
        fb.appendChild(el("p", null, q.explicacao_correta));
        const why = el("p");
        why.appendChild(el("strong", null, "Por que as outras falham: "));
        why.appendChild(document.createTextNode(q.por_que_outras_falham));
        fb.appendChild(why);
        card.appendChild(fb);
      }

      root.appendChild(card);
    });

    updateSimProgress();
  }

  function setupSimButtons() {
    const btnFinish = document.getElementById("btn-finalizar-simulado");
    const btnReset = document.getElementById("btn-refazer-simulado");
    const banner = document.getElementById("sim-resultado");

    btnFinish.addEventListener("click", () => {
      simFinished = true;
      const total = studyData.simulado.length;
      const hits = studyData.simulado.filter(
        (q) => simAnswers[q.id] === q.correta
      ).length;
      const pct = Math.round((hits / total) * 100);

      banner.textContent =
        "Placar Final: " + hits + " de " + total + " acertos (" + pct + "%)";
      banner.hidden = false;
      btnFinish.hidden = true;
      btnReset.hidden = false;
      renderSimulado(studyData);
    });

    btnReset.addEventListener("click", () => {
      simFinished = false;
      Object.keys(simAnswers).forEach((k) => delete simAnswers[k]);
      banner.hidden = true;
      btnFinish.hidden = false;
      btnReset.hidden = true;
      renderSimulado(studyData);
    });
  }

  function renderReferences(data) {
    const ul = document.getElementById("lista-referencias");
    ul.innerHTML = "";
    data.referencias.forEach((ref) => {
      const li = el("li");
      const a = document.createElement("a");
      a.href = ref.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = ref.titulo;
      li.appendChild(a);
      li.appendChild(document.createTextNode(" (" + ref.tipo + ")"));
      ul.appendChild(li);
    });
  }

  async function init() {
    try {
      setupTabs();
      setupSimButtons();
      studyData = await loadData();
      renderHeader(studyData);
      renderResumo(studyData);
      renderCertoErrado(studyData);
      renderSimulado(studyData);
      renderReferences(studyData);
    } catch (err) {
      document.getElementById("meta-titulo").textContent = "Erro ao carregar material";
      document.getElementById("meta-resumo").textContent = String(err);
    }
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
