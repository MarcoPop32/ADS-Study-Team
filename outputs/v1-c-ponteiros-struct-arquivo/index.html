<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guia Interativo ADS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-top">
        <span id="meta-disciplina" class="badge">ATP — ADS</span>
        <span id="meta-versao" class="badge badge-muted">v1</span>
      </div>
      <h1 id="meta-titulo">Carregando material...</h1>
      <p id="meta-resumo" class="subtitle"></p>
      <div class="meta-bar">
        <span id="meta-tempo"></span>
        <span id="meta-contagem"></span>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Navegação do material">
      <button class="tab-btn active" data-tab="resumo" role="tab" aria-selected="true">Resumo Direto</button>
      <button class="tab-btn" data-tab="ce" role="tab" aria-selected="false">Certo ou Errado</button>
      <button class="tab-btn" data-tab="simulado" role="tab" aria-selected="false">Simulado</button>
    </nav>

    <main>
      <section id="tab-resumo" class="tab-panel active"></section>

      <section id="tab-ce" class="tab-panel">
        <div class="panel-header">
          <div>
            <h2>Questões Certo ou Errado</h2>
            <p class="muted">Responda para ver a explicação passo a passo na hora.</p>
          </div>
          <div id="ce-placar" class="pill-score">0 / 0 respondidas</div>
        </div>
        <div id="ce-lista" class="stack"></div>
      </section>

      <section id="tab-simulado" class="tab-panel">
        <div class="panel-header">
          <div>
            <h2>Simulado Prático</h2>
            <p class="muted">Marque uma alternativa por questão e clique em Finalizar.</p>
          </div>
          <div id="sim-progresso" class="pill-score">0 / 0 marcadas</div>
        </div>
        <div id="sim-lista" class="stack"></div>
        <div class="sim-actions">
          <button id="btn-finalizar-simulado" class="btn-primary" type="button">Finalizar Simulado</button>
          <button id="btn-refazer-simulado" class="btn-secondary" type="button" hidden>Refazer Simulado</button>
        </div>
        <div id="sim-resultado" class="result-banner" hidden></div>
      </section>
    </main>

    <footer class="refs-footer">
      <h3>Referências Técnicas Verificadas</h3>
      <ul id="lista-referencias"></ul>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
